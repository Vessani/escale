name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verificar:
    runs-on: ubuntu-latest
    env:
      # Só pra `prisma generate` e os imports — os testes não tocam no banco.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      NEXTAUTH_SECRET: ci-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tipos
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Formatação
        run: npm run format:check
      - name: Código sem uso
        run: npm run knip
      - name: Testes (UTC, como na Vercel)
        run: npm test
      - name: Testes (horário de Brasília)
        run: npm run test:br
